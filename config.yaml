# WEEX AI Wars — AI-driven config.
# DeepSeek is the primary decision-maker; the risk block below is a hard veto layer
# it cannot override. Rules (AI Wars II): scoring is MULTI-METRIC — profit AND risk
# management AND strategy stability, not cumulative PnL alone — min 10 trades,
# max 20x leverage, >8h without AI logs is non-compliant.

# AI decision layer
ai:
  enabled: true
  provider: deepseek
  # Verified against /models on 2026-07-25: only deepseek-v4-pro and
  # deepseek-v4-flash exist. deepseek-chat (V3) was retired by the provider on
  # 2026-07-24 and every call 400'd for 16h while all healthchecks stayed green —
  # the client now validates this id at startup and refuses to run on a dead one.
  # v4-pro over v4-flash: at 24 calls/day cost is negligible and the decision is
  # the whole product; ~1.5s latency is irrelevant on an hourly cadence.
  model: deepseek-v4-pro
  base_url: https://api.deepseek.com
  temperature: 0.3
  # Both v4 models emit reasoning_content, and the thinking is charged against
  # this budget BEFORE the answer is written. 2000 was enough for V3's bare JSON
  # but would be consumed by reasoning and return empty content (= a silent hold).
  max_tokens: 8000
  # A real 8-symbol prompt measured 64s / 9.7k tokens on v4-pro (it writes ~9k
  # chars of reasoning first), so 90s left almost no headroom and a slow call
  # would time out into a lost hour of trading. Retries drop to 1 to keep the
  # worst case bounded: the AI call blocks the 60s cycle loop, and stop
  # enforcement runs on that loop, so total attempt budget is a risk parameter
  # and not just a latency one. 2 x 150s ~= the old 3 x 90s.
  timeout_seconds: 150
  max_retries: 1
  # Consecutive failed calls before the bot is declared brain-dead: logs at ERROR
  # and fails the container healthcheck instead of holding forever in silence.
  # NOTE this counter only governs TRANSIENT failures now. A 402/401/404 is
  # terminal on the first occurrence and alarms immediately — see client.py
  # TERMINAL_ERROR_KINDS.
  max_consecutive_failures: 3
  # Provider credit watchdog. The account hit zero on 2026-08-07 22:19 and the bot
  # sat blind for 65 hours (39% of a weekly round) before anyone noticed, because
  # nothing watched the balance and /models answers fine at zero. GET /user/balance
  # is free, so it is polled on this cadence and alarms BEFORE the wall, not after.
  balance_warn_usd: 2.0
  balance_check_hours: 6
  # Every call writes an AI log entry, trade or no trade. 60min keeps us far inside
  # the 8h inactivity rule even if several calls fail in a row.
  decision_interval_minutes: 60
  min_conviction: 0.35          # below this, the model's own doubt vetoes the trade
  # Not a rejection threshold any more — a stop tighter than this is WIDENED to it
  # (target scaled with it, so the model's R:R is preserved and pace is not lost).
  # 0.5 was low enough to be inert: live stops landed at 0.4-1.6x ATR and 7 of 20
  # trades were noise-stopped. Measured over 8 pairs x 120d with risk-based sizing,
  # both OOS halves agreeing, 7/8 pairs preferred >= 1.6x ATR and the optimum was a
  # plateau at 2.0-2.5x (run_stop_width.py).
  #
  # 1.8 -> 2.0 on 2026-08-12. RESEARCH.md §2j proposed 2.2; measuring it properly
  # says 2.0. The floor is NOT the realised stop — it only moves the trades that
  # declare tighter. Over the 74 real entry decisions in logs/ai_decisions.jsonl the
  # model declares a median 1.59x ATR stop, so each floor produces a distribution:
  #   floor 1.8 -> widens 57% of entries, realised mean 2.03x, cost -$0.4622/trade
  #   floor 2.0 -> widens 68%,            realised mean 2.15x, cost -$0.4205  (+0.042)
  #   floor 2.2 -> widens 85%,            realised mean 2.30x, cost -$0.4197  (+0.043)
  #   floor 2.5 -> widens 88%,            realised mean 2.56x, cost -$0.4184  (+0.044)
  # (cost = each trade's effective width priced against run_stop_width.py's measured
  # zero-alpha curve.) 2.0 captures 98% of the available gain while overriding the
  # model's own choice on 17% fewer trades than 2.2 — the cheapest version of the
  # change, not the largest-sounding one.
  min_stop_atr: 2.0
  max_stop_atr: 4.0             # wider than this is not a trade
  # RSI/Bollinger/StochRSI/VWAP + edge_signals in the AI context. Measured: triggers
  # a memorised "fade to VWAP" reflex (~80% of decisions) with no PnL benefit in any
  # replay arm. Do not enable without re-running run_ai_replay A/B first.
  include_oscillators: false
  # These default OFF to preserve the exact deployed decision surface. The replay
  # now follows these same flags unless an experiment explicitly overrides them.
  # Turn either on only after an out-of-sample replay shows it helps.
  include_positioning: false
  include_macro: false
  log_file: logs/ai_decisions.jsonl

# Execution: how orders reach the venue. Round-trip cost with market orders
# measured 0.22% of notional vs a best measured edge of ~0.13%/trade — the spread
# and taker fee were the entire losing margin. Maker entries rest at the touch,
# chase a little, and abandon rather than ever cross the spread.
execution:
  maker_entries: true
  maker_fee_rate: 0.0002        # WEEX futures maker tier; taker stays at backtest.commission_rate
  entry_ttl_minutes: 45         # unfilled after this = the setup left without us; fine
  reprice_seconds: 180          # re-quote toward the touch at most this often
  max_chase_atr: 0.5            # never chase price further than this from the signal
  # Rest the TAKE-PROFIT leg too, instead of firing a market order at a price we
  # already chose. A TP is favourable by construction (above the market for a long),
  # so a limit there is maker by definition and can never cross the spread — the old
  # `take_profit_market` was paying taker 0.06% + 0.05% slippage for nothing.
  # Measured on zero-alpha entries (run_exit_lab.py --entries random, n=4584):
  # net/trade -1.2161 -> -1.0071, i.e. +$0.209/trade, a 17% cut in the cost drag.
  # Stops stay taker — a stop crosses the book by construction and cannot rest.
  # Paper applies the SAME trade-through test as maker entries, so a touch that
  # reverses does not count as a fill; live places it post-only and falls back to
  # the old stop-market if the venue rejects, so a position is never left with no
  # venue-side TP.
  maker_exits: true
  # Paper realism. Both default ON and exist to be turned OFF only when reproducing
  # a pre-2026-08-03 run, never to make a new result look better.
  paper_funding: true           # settle 00/08/16 UTC funding to the paper balance
  paper_fill_through_ticks: 1   # market must trade THROUGH our limit, not just touch it

trading:
  mode: paper
  # The 8 pairs WEEX permits. Anything else is disqualified.
  symbols:
  - BTC/USDT:USDT
  - ETH/USDT:USDT
  - SOL/USDT:USDT
  - BNB/USDT:USDT
  - XRP/USDT:USDT
  - DOGE/USDT:USDT
  - ADA/USDT:USDT
  - LTC/USDT:USDT
  default_leverage: 5
  max_leverage: 20              # competition ceiling
  timeframe: 1h
  higher_timeframe: 4h
  # 200h > 1 week, so the model's 7d change and 72h levels actually populate.
  lookback_periods: 200
  htf_lookback: 80
risk:
  max_risk_per_trade: 0.012
  max_drawdown: 0.15
  # Counts are a BACKSTOP, not the working constraint. Measured 2026-08-01: at 3
  # this cap bound on 15 of 67 decision cycles, and the model's response was to
  # close live positions to make room — one such close realised -3.03 and the very
  # same short was re-opened 62 minutes later, paying two extra round trips to
  # re-enter its own trade. Scarcity was manufacturing the exit leak that was being
  # blamed on the model. At the sizes this bot actually trades — measured 0.32x
  # equity of notional per leg over 11 live trades — max_correlated_notional bites
  # on the FOURTH same-side leg (0.84x at 3 legs, 1.09x at 4, at the measured
  # median pair correlation of +0.64). So a count of 3 was strictly tighter than
  # the budget and did all the binding, crudely. Raising it to 5 hands control
  # back to the budget, which scales a crowded leg down instead of forcing an
  # exit, and still lets a genuinely diversified book hold five.
  max_open_positions: 5
  # Counts SYMBOLS, so it cannot tell BTC+ETH (~0.9 correlated, one double-sized
  # bet) from BTC+DOGE. Kept as a coarse backstop; max_portfolio_risk below is the
  # control that actually binds.
  max_same_side_positions: 3
  # Anti-churn: when the book is full, a close is only honoured if the model also
  # wants a replacement whose conviction beats the incumbent's by this margin.
  # Below it the close is capacity-motivated churn and is refused. 0 disables.
  swap_conviction_margin: 0.15
  # Correlation-aware portfolio budget: the most we accept losing if EVERY open stop
  # fills in the same move. Measured 2026-07-27, the bot held BTC long + ETH long at
  # once — legal under the position count, ~0.9 correlated in fact, and they went
  # underwater together. 2.0% sits just under the 2.5% daily loss limit so a full
  # simultaneous stop-out does not by itself end the trading day. New entries are
  # SCALED DOWN to fit rather than rejected: losing the trade costs pace, and a
  # smaller trade still bounds the loss.
  max_portfolio_risk: 0.02
  # The second correlation budget, and the one that binds in practice. Stop-out risk
  # bounds the TAIL; this bounds the day-to-day SWING, which is what the stability
  # metric actually scores. Equity-curve volatility tracks correlated NOTIONAL, not
  # stop distance: the observed BTC+ETH pair was a harmless 0.71% of equity in
  # stop-out terms but $713 of correlation-adjusted notional on $1k, and that mark
  # is what moved the curve. 1.0x equity lets two correlated legs through and bites
  # on the third — i.e. it forbids turning the book into one 3x beta bet.
  max_correlated_notional: 1.0
  correlation_lookback: 100     # 1h bars behind the return-correlation estimate
  correlation_floor: 0.5        # never count a same-side pair below this (tails spike)
  cooldown_after_losses: 3
  max_consecutive_losses: 3
  cooldown_hours: 6
  daily_loss_limit: 0.025
  trailing_stop_activation: 0.012
  # Now an OUTER bound, not the binding constraint: adjust_stops takes the looser of
  # this and the chandelier, so the ATR-adaptive stop leads and this only catches the
  # pathological case. Widened from 0.006 to match — at 0.6% it would still be the
  # looser one only rarely, which would leave the old behaviour in place.
  trailing_stop_distance: 0.02
  chandelier_atr_mult: 2.3
  # Breakeven at 1R gave back a full R of room the instant a trade worked; 1.75R
  # keeps the protection but only once the trade has earned it. Measured: 2R was
  # marginally better still, but at a 1.8x ATR stop 2R lands beyond most targets,
  # which disables the protection entirely rather than improving it.
  be_trigger_r: 1.75
  win_streak_cooldown: false
  # OFF by measurement. Banking half at the midpoint to TP looked prudent and was the
  # single largest value destroyer in the exit lab: it pays an extra round trip, and
  # it flips the position into the post-partial regime whose 0.45% trail then closes
  # the remainder at +0.3-0.9%. Live evidence: all 5 be_stop exits were capped wins
  # (+1.70..+2.94) while stops ran to -5.10, for a payoff of 0.63 against the 2.0 a
  # 30% win rate needs. The damage SCALES WITH EDGE — on zero-alpha entries turning
  # it off is worth +0.01/trade, at 60% accuracy it is worth +0.13 — which is exactly
  # what an exit rule that truncates the right tail should look like.
  partial_tp_enabled: false
  partial_be_buffer_atr: 0.12
strategy:
  name: composite
  trend_follow:
    enabled: false
    enabled_pairs: []
    adx_threshold: 25
    max_extension_atr: 0.55
  breakout:
    enabled: false
  mean_reversion:
    enabled: true
    strength: 0.76
    max_adx: 30
    min_z: 0.88
    min_volume_ratio: 0.55
    runner_extension_atr: 0.4
    rsi_period: 10
    rsi_overbought: 70
    rsi_oversold: 30
    bb_period: 20
    bb_std: 2.0
  keepalive:
    # OFF, and it must stay off in AI mode: keepalive only ever ran on the rules
    # path (_run_rules_cycle), which `ai.enabled: true` never reaches — so this flag
    # was inert for the whole paper run and produced zero trades. It is also the
    # wrong tool for AI Wars II: a code-generated heartbeat order has no model
    # decision behind it, so it would upload with no ai-log (non-compliant), and
    # robotic in-outs are penalised by the stability metric. The trade floor is now
    # handled by feeding round pace into the AI context (see _trade_pace).
    enabled: false
    symbol_base: SOL
    interval_hours: 12
    strength: 0.04
    max_per_week: 5
competition:
  min_trades: 10                # below this = disqualified
  # The minimum is per ROUND, and rounds are weekly — 10 trades in 7 days needs
  # ~1.4/day. Measured 2026-07-27 from the decision log: 28 entry decisions over
  # 12 days = ~2.3/day, i.e. ~16 per weekly round, comfortably clear of the floor.
  # (An earlier read of ~9/day came from trade_history timestamps that a loader
  # had invented — see RESEARCH.md §4. Count entries in the decision log, not
  # closes in state, when judging pace.)
  # Set round_started at the top of each live round so pace is measured against
  # the real clock; left unset, pace is measured over a trailing round_days window.
  round_days: 7
  # round_started: "2026-08-31T00:00:00"
  # ends_at: "2026-07-28T12:00:00"   # set this so the AI knows its clock
  min_edges: 1
  min_rr: 1.35
  allow_asia_mr: true
  skip_asia_trend: true
  htf_directional_bias: true
  long_only: false
  partial_tp: true
  pure_edge: true
  disabled_pairs: []
edges:
  funding_extreme: 0.0003
  funding_crowded: 0.0005
indicators:
  atr_period: 14
  vwap_period: 20
  ema_fast: 9
  ema_slow: 21
  adx_period: 14
sizing:
  method: fixed_fractional
  default_win_rate: 0.52
  min_position_usd: 10
  max_position_pct: 0.75
backtest:
  # WEEX resets every account to 1,000 USDT at the start. Sizing off 10,000 would
  # propose positions the real account cannot margin.
  initial_capital: 1000
  commission_rate: 0.0006
  slippage_pct: 0.0005
  use_kill_switch: false
logging:
  level: INFO
  file: logs/trading.log
  console: true
  state_file: data/bot_state.json
_tune:
  variant: pure_edge_multi
  full_pnl: 157.31
  oos_pnl: 12.85
  days: 120
  version: v8.5
